
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vehicle Yard Management System</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                🚗
            </div>

            <h1>Vehicle Yard</h1>

            <p class="subtitle">
                Management System
            </p>

            <form id="loginForm">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required>


                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required>


                <button type="submit">
                    Login
                </button>

            </form>

            <p id="message"></p>

            <div class="demo">

                <b>Demo Login</b>

                <p>Username: admin</p>
                <p>Password: 1234</p>

            </div>

        </div>

    </div>


    <script src="js/app.js"></script>

</body>

</html>
